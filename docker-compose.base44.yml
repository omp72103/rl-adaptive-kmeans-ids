services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -r requirements.txt &&
        exec uvicorn api.app:app --reload --host 0.0.0.0 --port 8000
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health',timeout=5); sys.exit(0)"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 60s
